<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="fio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D4EDD" stop-opacity="0"/>
      <stop offset=".25" stop-color="#9D4EDD" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#D896FF" stop-opacity=".9"/>
      <stop offset=".75" stop-color="#9D4EDD" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9D4EDD" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#D896FF" stop-opacity=".9"/><stop offset="1" stop-color="#9D4EDD" stop-opacity="0"/></radialGradient>
    <linearGradient id="borra" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D896FF" stop-opacity="0"/><stop offset="1" stop-color="#D896FF" stop-opacity=".8"/></linearGradient>
    <style>
      .anda { animation: anda 5s cubic-bezier(.65, 0, .35, 1) infinite; }
      @keyframes anda { 0% { transform: translateX(-140px); } 100% { transform: translateX(1340px); } }
      @media (prefers-reduced-motion: reduce) { .anda { animation: none; transform: translateX(600px); } }
    </style>
  </defs>
  <rect x="0" y="17.5" width="1200" height="1" fill="url(#fio)"/>
  <g class="anda">
    <rect x="-120" y="17" width="120" height="2" rx="1" fill="url(#borra)"/>
    <ellipse cx="0" cy="18" rx="26" ry="9" fill="url(#brilho)" opacity=".9"/>
    <circle cx="0" cy="18" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
